version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: pawhome-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pawhomedb
    ports:
      - "3306:3306"

  backend:
    build: ./backend
    container_name: pawhome-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/pawhomedb?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - mysqldb

  frontend:
    build: ./frontend
    container_name: pawhome-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
